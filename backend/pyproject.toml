[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "robust-rag-backend"
version = "0.1.0"
description = "Backend API and ingestion worker for Robust RAG"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "celery[redis]>=5.5,<6",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "beautifulsoup4>=4.13,<5",
  "markdown-it-py>=4,<5",
  "openpyxl>=3.1,<4",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "python-docx>=1.2,<2",
  "python-pptx>=1.0,<2",
  "redis>=6.2,<7",
  "sqlalchemy>=2.0,<3",
  "structlog>=25.4,<26",
  "uvicorn[standard]>=0.35,<1",
  "llama-index-core>=0.14.23,<0.15",
  "llama-index-graph-stores-neo4j>=0.7,<0.8",
  "neo4j>=5.16,<6",
]

[project.optional-dependencies]
dingo = ["dingo-python==2.5.0"]

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/robust_rag"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["robust_rag"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["bs4", "celery", "celery.*", "docx", "docx.*", "openpyxl", "openpyxl.*", "pptx", "pptx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=robust_rag --cov-report=term-missing"
testpaths = ["tests"]
markers = [
  "integration_live: opt-in tests that call configured external or paid services",
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
